<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEED — cold boot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
  :root{--phosphor:#ffb24a;--scan:rgba(0,0,0,.30);}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#000;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;}
  .cabinet{width:min(92vw,860px);aspect-ratio:4/3;background:radial-gradient(120% 120% at 50% 30%,#1a140d 0%,#0c0907 60%,#050403 100%);border-radius:22px;padding:clamp(14px,3vw,34px);position:relative;box-shadow:inset 0 2px 0 rgba(255,200,120,.06),inset 0 -8px 24px rgba(0,0,0,.8),0 40px 80px rgba(0,0,0,.7);}
  .screen{position:relative;width:100%;height:100%;border-radius:50% / 8%;overflow:hidden;background:#080604;box-shadow:inset 0 0 60px rgba(0,0,0,.95),inset 0 0 14px rgba(255,178,74,.05);}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .glass-fx{position:absolute;inset:0;pointer-events:none;z-index:3;mix-blend-mode:multiply;background:repeating-linear-gradient(0deg,transparent 0px,transparent 2px,var(--scan) 3px,var(--scan) 4px);}
  .vignette{position:absolute;inset:0;pointer-events:none;z-index:4;border-radius:50% / 8%;background:radial-gradient(120% 120% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%);}
  .bloom{position:absolute;inset:0;pointer-events:none;z-index:2;border-radius:50% / 8%;box-shadow:inset 0 0 120px rgba(255,178,74,.06);}
  .screen.off canvas{animation:collapse .55s ease-in forwards}
  @keyframes collapse{0%{transform:scale(1,1);opacity:1}45%{transform:scale(1,.012);opacity:1;filter:brightness(2.5)}60%{transform:scale(1,.012)}100%{transform:scale(.0015,.0015);opacity:.9;filter:brightness(6)}}
  .panel{position:absolute;left:0;right:0;bottom:-2px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,40px);height:clamp(14px,3vw,30px);z-index:5;}
  .label{font-size:9px;letter-spacing:.28em;color:#5a4326;text-transform:uppercase;user-select:none}
  .power{appearance:none;border:none;cursor:pointer;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a3a,#7a1d08);box-shadow:0 0 8px rgba(255,90,40,.7),inset 0 -2px 3px rgba(0,0,0,.6);}
  .power:focus-visible{outline:2px solid var(--phosphor);outline-offset:3px}
  .power.dead{background:radial-gradient(circle at 35% 30%,#3a2a1a,#120c08);box-shadow:none}
  @media (prefers-reduced-motion:reduce){.screen.off canvas{animation:none;opacity:.05}}
</style>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="cb" content="8a0f5890">
  <link rel="icon" type="image/svg+xml" href="./public/cb-shapes/10.svg?v=8a0f5890">
  <script src="./public/cb-badge.js?v=8a0f5890" defer></script>
</head>
<body>
  <div class="cabinet">
    <div class="screen" id="screen">
      <canvas id="c"></canvas>
      <div class="bloom"></div><div class="glass-fx"></div><div class="vignette"></div>
    </div>
    <div class="panel"><span class="label">SEED · UNIT 01</span><button class="power" id="power" aria-label="Power"></button></div>
  </div>
<script type="module" src="./main.js?v=8a0f5890"></script>
</body>
</html>
