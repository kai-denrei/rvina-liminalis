<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>SEED — cold boot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
  :root{--phosphor:#ffb24a;--scan:rgba(0,0,0,.30);}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#000;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation;}
  .cabinet{width:min(92vw,860px);aspect-ratio:4/3;background:radial-gradient(120% 120% at 50% 30%,#1a140d 0%,#0c0907 60%,#050403 100%);border-radius:22px;padding:clamp(14px,3vw,34px);position:relative;box-shadow:inset 0 2px 0 rgba(255,200,120,.06),inset 0 -8px 24px rgba(0,0,0,.8),0 40px 80px rgba(0,0,0,.7);}
  .screen{position:relative;width:100%;height:100%;border-radius:50% / 8%;overflow:hidden;background:#080604;box-shadow:inset 0 0 60px rgba(0,0,0,.95),inset 0 0 14px rgba(255,178,74,.05);}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .glass-fx{position:absolute;inset:0;pointer-events:none;z-index:3;mix-blend-mode:multiply;background:repeating-linear-gradient(0deg,transparent 0px,transparent 2px,var(--scan) 3px,var(--scan) 4px);}
  .vignette{position:absolute;inset:0;pointer-events:none;z-index:4;border-radius:50% / 8%;background:radial-gradient(120% 120% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%);}
  .bloom{position:absolute;inset:0;pointer-events:none;z-index:2;border-radius:50% / 8%;box-shadow:inset 0 0 120px rgba(255,178,74,.06);}
  .screen.off canvas{animation:collapse .55s ease-in forwards}
  @keyframes collapse{0%{transform:scale(1,1);opacity:1}45%{transform:scale(1,.012);opacity:1;filter:brightness(2.5)}60%{transform:scale(1,.012)}100%{transform:scale(.0015,.0015);opacity:.9;filter:brightness(6)}}
  .panel{position:absolute;left:0;right:0;bottom:-2px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,40px);height:clamp(14px,3vw,30px);z-index:5;}
  .label{font-size:9px;letter-spacing:.28em;color:#5a4326;text-transform:uppercase;user-select:none}
  .power{appearance:none;border:none;cursor:pointer;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a3a,#7a1d08);box-shadow:0 0 8px rgba(255,90,40,.7),inset 0 -2px 3px rgba(0,0,0,.6);}
  .power:focus-visible{outline:2px solid var(--phosphor);outline-offset:3px}
  .power.dead{background:radial-gradient(circle at 35% 30%,#3a2a1a,#120c08);box-shadow:none}
  /* ---- control deck: cabinet hardware (markup injected by touch.js on coarse pointers only) ---- */
  .deck{display:none;align-items:center;justify-content:space-between;gap:clamp(14px,5vw,40px);margin-top:2px;padding:clamp(10px,3vw,18px) clamp(16px,5vw,40px);border-radius:14px;background:radial-gradient(140% 150% at 50% 0%,#171108 0%,#0b0806 55%,#050403 100%);box-shadow:inset 0 2px 0 rgba(255,200,120,.05),inset 0 -6px 16px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.5);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
  .deck button{appearance:none;border:none;padding:0;cursor:pointer;font-family:inherit;touch-action:none;user-select:none;-webkit-user-select:none;}
  .dpad{--dk:clamp(42px,13vw,52px);display:grid;grid-template-columns:repeat(3,var(--dk));grid-template-rows:repeat(3,var(--dk));gap:7px;}
  .dk{width:var(--dk,48px);height:var(--dk,48px);border-radius:12px;color:#7a5a30;font-size:15px;line-height:1;background:radial-gradient(circle at 35% 28%,#2a1f12,#0e0a07 78%);box-shadow:0 4px 8px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,200,120,.10),inset 0 -4px 6px rgba(0,0,0,.7);}
  .dk.up{grid-area:1/2}.dk.left{grid-area:2/1}.dk.right{grid-area:2/3}.dk.down{grid-area:3/2}
  .acts{display:flex;align-items:flex-end;gap:clamp(16px,5vw,34px);}
  .act{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .dk.fire{--dk:clamp(64px,19vw,76px);border-radius:50%;background:radial-gradient(circle at 35% 28%,#b14a1e 0%,#6e2008 55%,#3a0e04 100%);box-shadow:0 5px 12px rgba(0,0,0,.6),0 0 10px rgba(255,90,40,.2),inset 0 2px 2px rgba(255,160,90,.22),inset 0 -6px 10px rgba(0,0,0,.65);}
  .dk.menu{--dk:34px;border-radius:50%;}
  .deck .dk:active,.deck .dk.held{box-shadow:inset 0 4px 10px rgba(0,0,0,.85),inset 0 -1px 0 rgba(255,200,120,.04);filter:brightness(1.3);transform:translateY(1px);}
  .deck .dk.fire:active,.deck .dk.fire.held{box-shadow:inset 0 5px 14px rgba(0,0,0,.8),0 0 14px rgba(255,90,40,.32);filter:brightness(1.15);transform:translateY(1px);}
  .deck .dk.latched{filter:brightness(1.35);color:#ffb24a;box-shadow:inset 0 0 9px rgba(255,178,74,.35),inset 0 1px 0 rgba(255,200,120,.16),0 0 10px rgba(255,178,74,.28),0 4px 8px rgba(0,0,0,.55);} /* engaged latch: lit steady, not pressed */
  /* ---- aux terminal: separate phosphor readout above the cabinet (markup injected by
          terminal.js on ALL pointers). An external magnifier for the corner command-line —
          the canvas log itself is sacred and untouched. Desktop body stacks as a column
          (Gerald-sanctioned DOM; the canvas stays pixel-identical). ---- */
  body{flex-direction:column;gap:12px;}
  .auxterm{flex:none;width:min(92vw,860px);position:relative;overflow:hidden;background:#070503;border:1px solid #5a3a12;border-radius:10px;box-shadow:inset 0 0 18px rgba(255,178,74,.05),0 6px 18px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
  .auxterm::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0px,transparent 2px,rgba(0,0,0,.16) 3px,rgba(0,0,0,.16) 4px);}
  .auxterm-head{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;border-bottom:1px solid rgba(90,58,18,.5);position:relative;z-index:1;background:#070503;}
  .auxterm-keys{display:flex;gap:6px;position:relative;z-index:1;}
  .auxterm-btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-size:11px;line-height:1;padding:5px 9px;border-radius:7px;color:#7a5a30;background:radial-gradient(circle at 35% 28%,#2a1f12,#0e0a07 78%);box-shadow:0 2px 4px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,200,120,.10),inset 0 -2px 4px rgba(0,0,0,.7);}
  .auxterm-btn:active{box-shadow:inset 0 3px 7px rgba(0,0,0,.85);filter:brightness(1.3);transform:translateY(1px);}
  .auxterm-btn:focus-visible{outline:2px solid var(--phosphor);outline-offset:2px}
  .auxterm-scroll{overflow-y:auto;max-height:140px;padding:6px 10px 8px;color:var(--phosphor);text-shadow:0 0 6px rgba(255,178,74,.45);line-height:1.45;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text;}
  .auxterm-line.old{opacity:.65}
  @media (pointer:coarse){.auxterm-scroll{max-height:22vh}}
  @media (pointer:coarse) and (max-height:700px){.auxterm-scroll{max-height:13vh}}
  @media (pointer:fine){.deck{display:none}}
  @media (pointer:coarse){
    body{flex-direction:column;gap:12px;min-height:100dvh;}
    .cabinet{aspect-ratio:auto;display:flex;flex-direction:column;gap:clamp(6px,1.5vh,12px);}
    .screen{width:100%;height:auto;aspect-ratio:4/3;flex:none;}
    .panel{position:static;flex:none;}
    .deck{display:flex;}
    /* no OS text-selection / copy-translate callouts on the machine's own body (Gerald, 2026-06-11) */
    body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
    .auxterm-scroll{user-select:none;-webkit-user-select:none;}
  }
  /* narrow phones: the act row (FIRE · i·PACK · MENU) summed past 390px and the MENU
     button fell offscreen (body overflow:hidden clipped it) — tighten, don't shrink keys */
  @media (pointer:coarse) and (max-width:430px){
    .deck{gap:10px;padding:10px 12px;}
    .acts{gap:10px;}
    .dpad{gap:6px;}
  }
  @media (prefers-reduced-motion:reduce){.screen.off canvas{animation:none;opacity:.05}}
</style>

  <link rel="manifest" href="./manifest.webmanifest?v=244d1674">

  <meta name="apple-mobile-web-app-capable" content="yes">

<body>
  <div class="cabinet">
    <div class="screen" id="screen">
      <canvas id="c"></canvas>
      <div class="bloom"></div><div class="glass-fx"></div><div class="vignette"></div>
    </div>
    <div class="panel"><span class="label">SEED · UNIT 01</span><button class="power" id="power" aria-label="Power"></button></div>
  </div>
